services:
  paperbolt:
    build:
      context: ../..
      dockerfile: docker/embedded/Dockerfile
    container_name: paperbolt
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/info/status | grep -q 'UP'"]
      interval: 5s
      timeout: 10s
      retries: 16
    ports:
      - "8080:8080"
    volumes:
      - ../../paperbolt/latest/data:/usr/share/tessdata:rw
      - ../../paperbolt/latest/config:/configs:rw
      - ../../paperbolt/latest/logs:/logs:rw
    environment:
      DISABLE_ADDITIONAL_FEATURES: "false"
      SECURITY_ENABLELOGIN: "true"
      SYSTEM_DEFAULTLOCALE: en-US
      UI_APPNAME: PaperBolt
      UI_HOMEDESCRIPTION: Professional PDF tools for your workflow
      UI_APPNAMENAVBAR: PaperBolt
      SYSTEM_MAXFILESIZE: "100"
      METRICS_ENABLED: "true"
      SYSTEM_GOOGLEVISIBILITY: "false"
      SHOW_SURVEY: "false"
      # Azure AD OAuth Configuration (uncomment and configure for Azure Marketplace)
      SECURITY_OAUTH2_ENABLED: "true"
      SECURITY_OAUTH2_CLIENT_AZURE_TENANTID: "f04be385-b860-4186-9fa5-969e4c1e6b7c"
      SECURITY_OAUTH2_CLIENT_AZURE_CLIENTID: "af828319-6586-480c-9a8f-84a5c0c1c20f"
     
      # Azure Marketplace Configuration
      AZURE_MARKETPLACE_ENABLED: "true"
      AZURE_MARKETPLACE_TENANTID: "f04be385-b860-4186-9fa5-969e4c1e6b7c"
      AZURE_MARKETPLACE_CLIENTID: "af828319-6586-480c-9a8f-84a5c0c1c20f"
     
      # AZURE_MARKETPLACE_WEBHOOKSECRET: "L0fIvLa3gx3xnjp0oPhrHB8u"
      AZURE_MARKETPLACE_APPBASEURL: "https://55f8-49-36-211-64.ngrok-free.app"
    networks:
      - paperbolt-network

networks:
  paperbolt-network:
    driver: bridge

volumes:
  paperbolt-data:
  paperbolt-config:
  paperbolt-logs:
